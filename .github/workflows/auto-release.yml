name: Auto-create release from installer

on:
  push:
    branches: [main]
    paths:
      - 'releases/latest/*.exe'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find installer and extract version
        id: info
        run: |
          EXE=$(ls releases/latest/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "No .exe found in releases/latest/"
            exit 1
          fi
          FILENAME=$(basename "$EXE")
          VERSION=$(echo "$FILENAME" | grep -oP '\d+\.\d+\.\d+')
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from $FILENAME"
            exit 1
          fi
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Found: $FILENAME (v$VERSION)"

      - name: Check if release already exists
        id: check
        run: |
          TAG="${{ steps.info.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist, will create."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan with VirusTotal
        if: steps.check.outputs.exists == 'false'
        id: vtscan
        run: |
          EXE="${{ steps.info.outputs.exe }}"
          VT_KEY="${{ secrets.VT_API_KEY }}"

          if [ -z "$VT_KEY" ]; then
            echo "No VT_API_KEY secret set, skipping scan"
            echo "vt_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get upload URL for large files (>32MB)
          echo "Getting upload URL..."
          UPLOAD_URL=$(curl -s --request GET \
            --url https://www.virustotal.com/api/v3/files/upload_url \
            --header "x-apikey: $VT_KEY" | jq -r '.data // empty')

          if [ -z "$UPLOAD_URL" ]; then
            UPLOAD_URL="https://www.virustotal.com/api/v3/files"
          fi

          echo "Uploading to VirusTotal..."
          RESPONSE=$(curl -s --request POST \
            --url "$UPLOAD_URL" \
            --header "x-apikey: $VT_KEY" \
            --form "file=@$EXE")

          ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id // empty')
          if [ -z "$ANALYSIS_ID" ]; then
            echo "VirusTotal upload failed: $RESPONSE"
            echo "vt_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Uploaded. Analysis ID: $ANALYSIS_ID"

          # Get the file hash for permalink
          SHA256=$(sha256sum "$EXE" | cut -d' ' -f1)
          VT_URL="https://www.virustotal.com/gui/file/$SHA256"
          echo "VirusTotal report: $VT_URL"
          echo "vt_url=$VT_URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.info.outputs.tag }}"
          VERSION="${{ steps.info.outputs.version }}"
          EXE="${{ steps.info.outputs.exe }}"
          FILENAME="${{ steps.info.outputs.filename }}"
          VT_URL="${{ steps.vtscan.outputs.vt_url }}"
          SHA256="${{ steps.vtscan.outputs.sha256 }}"

          # Slice this version's section out of CHANGELOG.md: everything between its
          # "## [X.Y.Z]" heading and the next "## [" heading, with the --- separators
          # and trailing blank lines stripped. Uses index() (literal prefix match) to
          # avoid awk dynamic-regex escaping pitfalls with the bracketed version heading.
          CHANGELOG_SECTION=$(awk -v key="## [$VERSION]" '
            index($0, key) == 1 { capture=1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md | sed '/^---[[:space:]]*$/d' | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba}')

          # Assemble release notes: changelog body + download / platform / VirusTotal footer.
          {
            if [ -n "$CHANGELOG_SECTION" ]; then
              printf '%s\n\n' "$CHANGELOG_SECTION"
            else
              printf 'Automated release from installer commit.\n\n'
            fi
            echo "---"
            echo ""
            echo "**Download:** $FILENAME"
            echo "**Platform:** Windows 10/11 (x64)"
            if [ -n "$VT_URL" ]; then
              echo "**VirusTotal:** [\`$SHA256\`]($VT_URL)"
            fi
          } > release_notes.md

          echo "----- release notes -----"; cat release_notes.md; echo "-------------------------"

          gh release create "$TAG" "$EXE" \
            --title "KaptureVault v$VERSION" \
            --notes-file release_notes.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
